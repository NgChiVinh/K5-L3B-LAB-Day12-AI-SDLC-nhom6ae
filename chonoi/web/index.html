<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

let pendingAction = {};
function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return Object.assign({ move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause") }, pendingAction);
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  pendingAction = {};
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "escape" || k === "p") down.add("pause");
  else if (k === "1" || k === "2") { pendingAction.buy = k === "1" ? "oxygen" : "hp"; }
  else if (k === "enter") { pendingAction.shop_done = true; }
  else if (k === "q") { pendingAction.action = "continue"; }
  else if (k === "m") { pendingAction.action = "menu"; }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = { ca_loc_nuong_trui: "cá lóc nướng trui", goi_bong_sung: "gỏi bông súng", lau_ca_linh_dien_dien: "lẩu cá linh điên điển", canh_chua_ca_loc: "canh chua cá lóc", ca_keo_nuong: "cá kèo nướng", lau_mam: "lẩu mắm" };
const dn = (id) => DISH_NAME[id] || id;
// Kho khả dụng = tồn vật lý − phần khách đang giữ chỗ (PRD mục F, Quán bước 5; contracts mục 3).
function availableStock(stock, customers) {
  const out = Object.assign({}, stock || {});
  (customers || []).forEach((c) => Object.keys(c.reserved || {}).forEach((k) => { out[k] = (out[k] || 0) - c.reserved[k]; }));
  return out;
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
// Như text() nhưng cắt bớt kèm "…" để không vượt maxW (tránh tràn/đè khi cửa sổ hẹp). maxW < 20 thì không vẽ.
function fitText(s, x, y, maxW, o = {}) {
  if (maxW < 20) return;
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  s = String(s);
  if (ctx.measureText(s).width > maxW) {
    while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    s += "…";
  }
  text(s, x, y, o);
}
function panel(x, y, w, h, fill = "rgba(13,25,32,.88)") {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 12);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.15)";
  ctx.lineWidth = 1;
  ctx.stroke();
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function planIngredients() {
  const plan = snap.day_plan || {};
  return plan.ingredients || (Array.isArray(plan) ? plan[snap.day - 1]?.ingredients : null) || {};
}
function statusCard(w, h, title, subtitle, details, accent = "#f0cf88") {
  ctx.fillStyle = "rgba(5,12,18,.74)"; ctx.fillRect(0, 0, w, h);
  const pw = Math.min(680, w - 36), ph = Math.min(430, h - 36), x = (w - pw) / 2, y = (h - ph) / 2;
  panel(x, y, pw, ph, "rgba(18,32,40,.98)");
  text(title, w / 2, y + 62, { size: 30, align: "center", color: accent });
  fitText(subtitle || "", x + 28, y + 105, pw - 56, { size: 20, align: "center" });
  (details || []).slice(0, 9).forEach((line, i) => fitText(line, x + 36, y + 151 + i * 29, pw - 72, { size: 18, color: i % 2 ? "#cbd8d8" : "#f1e7d2" }));
}
function promptBox(w, h, message, color = "#fff0ae") {
  const width = Math.min(560, w - 32), height = 52;
  const x = (w - width) / 2, y = h - height - 22;
  panel(x, y, width, height, "rgba(10,24,32,.94)");
  ctx.strokeStyle = "rgba(255,232,170,.62)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, width, height, 12); ctx.stroke();
  fitText(message, x + width / 2, y + 33, width - 32, { size: 20, align: "center", color });
}
function drawPhaseScreen(w, h) {
  const phase = snap.phase;
  const ev = snap.events || [];
  const last = (name) => [...ev].reverse().find((e) => e.name === name)?.data || {};
  if (["day_intro", "DayIntro", "dayintro"].includes(phase)) {
    const p = snap.day_plan || {}, ingredients = p.ingredients || {};
    statusCard(w, h, `NGÀY ${snap.day || 1} · MÁ TƯ DẶN`, "Hôm nay mình sẽ nấu:", Object.keys(p.dishes || {}).map((id) => `${dn(id)} ×${p.dishes[id]}`).concat(["Nguyên liệu cần gom:"]).concat(Object.keys(ingredients).map((k) => `${KIND_NAME[k] || k}  ${ingredients[k]}`), ["Nhấn phím bất kỳ để bắt đầu · tự chuyển sau 4 giây"]));
    return true;
  }
  if (["evening_intro", "EveningIntro", "eveningintro"].includes(phase)) {
    const stock = snap.stock || {};
    statusCard(w, h, "HÀNG ĐÃ VỀ BẾN", "Kho bàn giao cho quán", Object.keys(stock).map((k) => `${KIND_NAME[k] || k} ×${stock[k]}`).concat(["Món có thể nấu sẽ hiện tại các bàn và bếp."])); return true;
  }
  if (["day_result", "DayResult", "dayresult"].includes(phase)) {
    const d = last("day_result");
    statusCard(w, h, `KẾT QUẢ NGÀY ${snap.day || ""}`, "Ca quán đã khép lại", [`Khách phục vụ: ${d.served ?? snap.served ?? "—"}`, `Khách bỏ đi: ${d.left ?? snap.left ?? "—"}`, `Tiền ca: ${d.shift_earned ?? snap.shift_earned ?? "—"}k`, `Boa: ${d.tips ?? snap.tips ?? "—"}k`, `Uy tín: ${d.reputation_delta ?? "—"}`, "Đang chuyển tới Shop…"]); return true;
  }
  if (["summary", "Summary", "summary_screen"].includes(phase)) {
    statusCard(w, h, "HẾT MỘT VÒNG NGÀY", "Quán mình hôm nay", [`Tổng tiền: ${snap.money ?? "—"}k`, `Tổng điểm: ${snap.score ?? "—"}`, `Uy tín: ${Number(snap.reputation ?? 0).toFixed(1)}/5`, `Món bán chạy: ${snap.best_seller ? dn(snap.best_seller) : "—"}`, "Cảm ơn bạn đã ghé quán!"]); return true;
  }
  if (["shop", "Shop"].includes(phase)) {
    const ups = snap.upgrades || {}, active = snap.active_upgrades || {}, entries = [];
    entries.push(`Tiền: ${snap.money ?? 0}k`);
    [["oxygen", "Bình oxy"], ["hp", "Áo phao"]].forEach(([id, label]) => entries.push(`${label}: cấp ${ups[id] || 0} (đang áp dụng ${active[id] || 0}) · nhấn ${id === "oxygen" ? "1" : "2"} để mua cấp tiếp`));
    entries.push("Nhấn Enter để đóng Shop và sang Ngày tiếp theo.");
    statusCard(w, h, "SHOP CUỐI NGÀY", `Ngày ${snap.day || 1} · nâng cấp áp dụng từ ngày mai`, entries, "#a9d6a2"); return true;
  }
  return false;
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

function drawGatherHud(w) {
  const p = snap.player || {};
  panel(12, 10, Math.max(280, w - 24), 70);
  text("BUỔI SÁNG · LẶN & HÁI", 26, 31, { size: 12, color: "#9bd5dc" });
  const secondsLeft = (snap.time_left_ticks || 0) / 60;
  const timerColor = secondsLeft <= 30 ? (Math.floor((snap.tick || 0) / 15) % 2 ? "#ff5252" : "#ffcdd2") : "#e8eef2";
  text("Còn " + fmtTime(snap.time_left_ticks), 26, 60, { size: 21, color: timerColor });
  const oxyMax = p.oxygen_max_ticks || 1;
  bar(155, 43, Math.max(100, Math.min(220, w * .23)), 20,
      (p.oxygen_ticks || 0) / oxyMax,
      p.oxygen_ticks < oxyMax * .25 ? "#ef5350" : "#45c4df",
      "Oxy " + Math.ceil((p.oxygen_ticks || 0) / 60) + "s");
  const hpMax = p.hp_max || 3;
  let hearts = "";
  for (let i = 0; i < hpMax; i++) hearts += i < (p.hp || 0) ? "♥" : "♡";
  text("Máu", 405, 32, { size: 11, color: "#b8c8cc" });
  text(hearts, 405, 59, { size: 22, color: "#ff7085" });
  const items = {};
  (snap.hold || []).forEach((kind) => { items[kind] = (items[kind] || 0) + 1; });
  const inventory = Object.keys(items).length
    ? Object.keys(items).map((k) => (KIND_NAME[k] || k) + " ×" + items[k]).join("  ·  ")
    : "Trống";
  // Cột giỏ đặt sau cột Máu (405 + ~65px), cắt chữ theo bề rộng còn lại để không đè/tràn khi cửa sổ hẹp.
  const gx = 470, gw = w - 24 - gx;
  fitText("GIỎ " + (snap.hold_count ?? (snap.hold || []).length) + "/" + (snap.hold_capacity || "—"), gx, 31, gw, { size: 11, color: "#b8c8cc" });
  fitText(inventory, gx, 54, gw, { size: 13, color: "#f1dfae" });
  const needed = planIngredients(), got = {};
  (snap.hold || []).forEach((k) => got[k] = (got[k] || 0) + 1);
  const neededText = Object.keys(needed).map((k) => `${KIND_NAME[k] || k} ${got[k] || 0}/${needed[k]}`).join(" · ");
  if (neededText) fitText("CẦN LẤY  " + neededText, 26, 78, w - 48, { size: 18, color: "#ffe6a8" });
  if (p.pos) text(`Độ sâu ${Number(p.pos[1]).toFixed(1)} m`, w - 28, 59, { size: 18, align: "right", color: "#d7ecf2" });
  if (snap.catch_cd_ticks > 0 || snap.catch_cooldown_ticks > 0) text(`Bắt cá hồi: ${Math.ceil((snap.catch_cd_ticks || snap.catch_cooldown_ticks) / 60)}s`, w - 28, 82, { size: 18, align: "right", color: "#d7ecf2" });
}

function drawQuanHud(w) {
  const customers = snap.customers || [];
  const stoves = snap.stoves || [];
  const stock = snap.stock || {};
  // Panel cao 132 để phủ cả hàng GỌI MÓN (y 111) và ĐANG CẦM (y 133); cảnh quán bắt đầu từ y 152.
  panel(12, 10, Math.max(280, w - 24), 132);
  text("BUỔI TỐI · NHÀ BÈ MÁ TƯ", 26, 30, { size: 12, color: "#f5d58a" });
  text("Còn " + fmtTime(snap.time_left_ticks), 26, 61, { size: 20 });
  text("Tiền " + (snap.money ?? 0) + "k", 145, 49, { size: 16, color: "#ffe08a" });
  text("Uy tín " + Number(snap.reputation ?? 0).toFixed(1) + "/5", 145, 70, { size: 13, color: "#d8c4ff" });
  // Điểm canh phải panel (trước đây ở x 145 đè lên tiêu đề BUỔI TỐI).
  text("Điểm " + (snap.score ?? 0), w - 26, 31, { size: 12, color: "#d7dbe0", align: "right" });
  // DoD: HUD buổi tối hiện KHO KHẢ DỤNG (tồn − phần khách giữ), không phải tồn vật lý.
  const avail = availableStock(stock, customers);
  const stockText = Object.keys(avail).sort().filter((k) => avail[k] > 0)
    .map((k) => (KIND_NAME[k] || k) + " ×" + avail[k]).join("  ·  ") || "Trống";
  text("KHO KHẢ DỤNG", 285, 31, { size: 11, color: "#b8c8cc" });
  fitText(stockText, 285, 52, w - 24 - 285, { size: 13, color: "#d6edda" });
  const stoveText = stoves.map((s) => {
    const dish = s.dish && s.dish.dish_id ? " " + dn(s.dish.dish_id) : "";
    const label = s.state === "cooking" ? "đang nấu" + dish + " " + Math.ceil((s.cook_ticks_left || 0) / 60) + "s" : s.state === "ready" ? "xong" + dish : "rảnh";
    return s.id + ": " + label;
  }).join("  ·  ") || "Chưa có bếp";
  text("BẾP", 285, 72, { size: 11, color: "#b8c8cc" });
  fitText(stoveText, 326, 72, w - 24 - 326, { size: 12, color: "#ffd1a1" });
  const orderText = customers.length
    ? customers.map((c) => {
        // Khách đang ăn không mất kiên nhẫn (PRD mục F) -> hiện thời gian ăn còn lại; khách chờ -> kiên nhẫn.
        const left = c.state === "eating"
          ? " · đang ăn " + Math.ceil((c.eat_ticks_left || 0) / 60) + "s"
          : c.patience_ticks_left === undefined ? "" : " · " + Math.ceil(c.patience_ticks_left / 60) + "s";
        const dish = c.dish_id ? dn(c.dish_id) : (c.order_status === "unfulfillable" ? "chưa có món" : "đang chọn món");
        return c.table_id + ": " + dish + left;
      }).join("  ·  ")
    : "Chưa có khách";
  text("GỌI MÓN", 26, 111, { size: 11, color: "#b8c8cc" });
  fitText(orderText, 100, 111, w - 24 - 100, { size: 12, color: "#f5e4d3" });
  const hand = snap.hand ? (typeof snap.hand === "string" ? dn(snap.hand) : dn(snap.hand.dish_id || "món")) : "Tay trống";
  fitText("ĐANG CẦM: " + hand, 26, 133, w - 24 - 26, { size: 12, color: "#ffcf8b" });
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 96, bottom = 76;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  (snap.monsters || []).forEach((m) => {
    const mp = m.pos || [0, 0]; ctx.fillStyle = "#bd71dc"; ctx.beginPath(); ctx.arc(sx(mp[0]), sy(mp[1]), Math.max(8, .75 * s), 0, Math.PI * 2); ctx.fill();
    text("🐊", sx(mp[0]), sy(mp[1]) + 6, { size: Math.max(16, .8 * s), align: "center" });
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  const playerPos = (p && p.pos) || [0, 0];
  const nearMonster = (snap.monsters || []).some((m) => m.pos && Math.hypot(m.pos[0] - playerPos[0], m.pos[1] - playerPos[1]) <= (meta.monster_warning_radius || 8));
  const nearNode = (snap.nodes || []).some((n) => n.ready !== false && Math.hypot(n.pos[0] - playerPos[0], n.pos[1] - playerPos[1]) <= 2);
  const dockPos = meta.dock_pos || [2, 0], nearDock = Math.hypot(dockPos[0] - playerPos[0], dockPos[1] - playerPos[1]) <= (meta.dock_radius || 3);
  if (nearMonster) { promptBox(w, h, "THỦY QUÁI!", "#efb4ff"); ctx.strokeStyle = "#bd71dc"; ctx.lineWidth = 5; ctx.strokeRect(3, 3, w - 6, h - 6); }
  else if (p.oxygen_ticks === 0) promptBox(w, h, "HẾT HƠI!", "#ffaaaa");
  else if (nearNode) promptBox(w, h, "E  ·  HÁI NGUYÊN LIỆU");
  else if (nearDock) promptBox(w, h, "E  ·  CẬP BẾN");
  // HUD và giỏ
  drawGatherHud(w);
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.max(10, Math.min(24, (w - 40) / cap - 4)), y0 = h - bottom + 8;
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    panel(10, y0 - 7, Math.min(w - 20, cap * (sz + 4) + 24), sz + 40, "rgba(13,25,32,.78)");
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) { ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
    }
    text(Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join("  ·  ") || "Giỏ trống", 14, y0 + sz + 18, { size: 12, color: "#cfd8dc" });
  }
  text("WASD / ←↑→↓ bơi  ·  E hái / cập bến  ·  Space bắt cá  ·  R chơi lại", w - 12, h - 12, { size: 11, align: "right", color: "#d4e0e5" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 152, bottom = 36;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) text(st.dish, sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 10, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(c.dish_id || "?", cx, cy - 0.75 * s, { size: 10, align: "center", color: "#2a1a0a" });
      if (c.patience_ticks_left !== undefined) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, c.patience_ticks_left / patMax, "#e57373");
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + hand, px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a" });
    }
  }
  drawQuanHud(w);
  text("WASD / ←↑→↓ đi  ·  E nấu / bưng / phục vụ  ·  R chơi lại", w - 12, h - 12, { size: 11, align: "right", color: "#f0e3ca" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.phase === "gather" || snap.phase === "quan" || !snap.phase) {
      if (snap.phase === "quan" || snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    } else if (!drawPhaseScreen(w, h)) {
      statusCard(w, h, "CHỢ NỔI NHÀ MÁ TƯ", "Một ngày mới đang chờ", ["Chơi", "Nhấn phím bất kỳ để tiếp tục"]);
    }
    eventLog(w, h);
    overlay(w, h);
    if (snap.state === "paused" || snap.paused) statusCard(w, h, "TẠM DỪNG", "Thời gian và mọi hoạt động đang dừng", ["Q · Tiếp tục", "M · Về menu", "P / Esc · Tiếp tục"], "#c5d8f5");
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
